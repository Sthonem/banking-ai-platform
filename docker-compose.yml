x-service-env: &service-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://banking:banking@postgres:5432/banking}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.85}
  FRAUD_MODEL_PATH: ${FRAUD_MODEL_PATH:-models/fraud_isolation_forest.joblib}
  ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      POSTGRES_DB: ${POSTGRES_DB:-banking}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migration:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/onboarding-service
        REQUIREMENTS_FILE: requirements/base.txt
        APT_PACKAGES: curl
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/api-gateway
        REQUIREMENTS_FILE: requirements/base.txt
        APT_PACKAGES: curl
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
      ONBOARDING_URL: http://onboarding-service:8000
      TRANSACTION_URL: http://transaction-service:8000
    depends_on:
      - redis
      - onboarding-service
      - transaction-service
    ports:
      - "8080:8000"

  onboarding-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/onboarding-service
        REQUIREMENTS_FILE: requirements/base.txt
        APT_PACKAGES: curl
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
      UPLOAD_DIR: /tmp/banking-ai-documents
    volumes:
      - documents-data:/tmp/banking-ai-documents
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8001:8000"

  transaction-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/transaction-service
        REQUIREMENTS_FILE: requirements/base.txt
        APT_PACKAGES: curl
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8002:8000"

  alert-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/alert-service
        REQUIREMENTS_FILE: requirements/base.txt
        APT_PACKAGES: curl
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
    depends_on:
      kafka:
        condition: service_healthy

  kyc-ai-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/kyc-ai-service
        REQUIREMENTS_FILE: requirements/kyc.txt
        APT_PACKAGES: "curl tesseract-ocr"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
    volumes:
      - documents-data:/tmp/banking-ai-documents
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  fraud-ai-service:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/fraud-ai-service
        REQUIREMENTS_FILE: requirements/fraud.txt
        APT_PACKAGES: "curl libgomp1"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-env
    volumes:
      - ./models:/app/services/fraud-ai-service/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3.4
    ports:
      - "9411:9411"

volumes:
  postgres-data:
  documents-data:
